name: Test and package desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SNAPSHOT_DISABLE_HOTKEYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python snapshot_pro.py --smoke-test
      - run: python build_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnapShotPro-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*Setup.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
